name: Compilar APK Android TermiPrint

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar TermiPrint.apk
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Dar permisos de ejecucion a gradlew
        run: chmod +x gradlew

      - name: Asegurar gradle wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -s -L "https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Compilar APK con Gradle
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace > gradle_build.log 2>&1 || true
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "================ ERROR COMPLETO DE COMPILACION ================"
            tail -n 100 gradle_build.log
            exit 1
          fi

      - name: Renombrar APK compilado
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/app-debug.apk release_apk/TermiPrint-Pro.apk

      - name: Subir APK como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: TermiPrint-Pro-APK
          path: release_apk/TermiPrint-Pro.apk

      - name: Crear Release publica con APK instalable
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.3
          name: "TermiPrint Pro v1.0.3 (APK Instalable)"
          body: |
            ### 🖨️ TermiPrint Pro v1.0.3 para Android
            - **Casilla de avance de líneas configurable:** Elige exactamente cuántas líneas avanzar al terminar el ticket (por defecto 2 líneas) con botones `+` y `-` para sacar y cortar el papel fácilmente sin avanzar manualmente.
            - **Fecha y hora al pie del ticket:** Impresión clara de fecha y hora al terminar.
            - **Recorte inteligente de espacio en blanco:** Sin desperdicio de papel.
            - **Icono HD en pantalla:** Icono nítido de alta resolución.
            - **Bluetooth nativo y menú Compartir:** Integración directa desde PDF, web o cualquier app.
            
            **Instrucciones:**
            Descarga `TermiPrint-Pro.apk` en tu tablet Xiaomi, ábrelo para actualizar/instalar y listo.
          files: release_apk/TermiPrint-Pro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar log de error si la compilacion fallo
        if: failure()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git checkout -B debug-log
          cp gradle_build.log build_error.txt
          git add build_error.txt
          git commit -m "Registro automatico del error de compilacion"
          git push -f origin debug-log
